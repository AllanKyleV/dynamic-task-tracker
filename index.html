<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="js-file.js" defer></script>
    <title>Dynamic Task Tracker</title>
</head>
<body>
    <!-- App Wrapper -->
    <div id="task-app">

        <!-- Header -->
        <header id="app-header">
            <h1>Dynamic Task Tracker</h1>
        </header>

        <!-- Task form -->
        <form id="task-form">
            <input type="text" id="task-input" placeholder="Task Name">
            <button type="submit" id="add-task-btn">Add Task</button>
        </form>

        <!-- Task filters -->
        <div id="task-filters">
            <button class="filter-btn" data-filter="all">All</button>
            <button class="filter-btn" data-filter="complete">Conmpleted</button>
            <button class="filter-btn" data-filter="incomplete">Incomplete</button>
        </div>

        <!-- Task list -->
        <ul id="task-list"></ul>

        <!-- Task list -->
        <div id="task-stats">
            <span id="total-count">Total: 0</span>
            <span id="completed-count">Completed: 0</span>
            <span id="incomplete-count">Incomplete: 0</span>
        </div>
    </div>
</body>
</html>
